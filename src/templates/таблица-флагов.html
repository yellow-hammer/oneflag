{% Если Модель.Строки.Количество() = 0 Тогда %}
<p class="пусто">Флагов пока нет. Создайте первый - он сразу появится у всех подключённых клиентов.</p>
{% Иначе %}
<table class="флаги">
	<thead>
		<tr><th>Флаг</th><th>Тип</th><th>Выкатка</th><th class="вправо">Состояние</th><th></th></tr>
	</thead>
	<tbody>
		{% Для Каждого РазметкаСтроки Из Модель.Строки Цикл %}{{ РазметкаСтроки }}{% КонецЦикла; %}
	</tbody>
</table>
{% КонецЕсли; %}
