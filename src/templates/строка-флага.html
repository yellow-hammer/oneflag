<tr id="флаг-{{ View.ЭкранироватьАтрибут(Модель.Ключ) }}" class="{% Если Модель.Включен Тогда %}включен{% КонецЕсли; %}">
	<td>
		<div class="ключ">{{ View.ЭкранироватьHtml(Модель.Ключ) }}</div>
		<div class="подпись">{{ View.ЭкранироватьHtml(Модель.Имя) }}</div>
	</td>
	<td><span class="тег">{{ View.ЭкранироватьHtml(Модель.Тип) }}</span></td>
	<td>
		<div class="выкатка" x-data="{ процент: {{ Модель.Процент }} }">
			<input type="range" min="0" max="100" step="5" name="процент" value="{{ Модель.Процент }}"
			       x-model="процент"
			       hx-post="{{ View.ЭкранироватьАтрибут(Модель.АдресВыкатки) }}"
			       hx-target="#флаг-{{ View.ЭкранироватьАтрибут(Модель.Ключ) }}"
			       hx-swap="outerHTML"
			       hx-trigger="change">
			<span class="процент" x-text="процент + '%'">{{ Модель.Процент }}%</span>
		</div>
	</td>
	<td class="вправо"><span class="состояние">{% Если Модель.Включен Тогда %}включён{% Иначе %}выключен{% КонецЕсли; %}</span></td>
	<td class="вправо">
		<button class="тумблер {% Если Модель.Включен Тогда %}вкл{% Иначе %}выкл{% КонецЕсли; %}"
		        hx-post="{{ View.ЭкранироватьАтрибут(Модель.АдресПереключения) }}"
		        hx-target="#флаг-{{ View.ЭкранироватьАтрибут(Модель.Ключ) }}"
		        hx-swap="outerHTML"
		        aria-label="Переключить флаг {{ View.ЭкранироватьАтрибут(Модель.Ключ) }}"><span class="ручка"></span></button>
	</td>
</tr>
